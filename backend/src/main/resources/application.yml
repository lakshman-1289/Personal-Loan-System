spring:
  application:
    name: ezfinanz-backend
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ezfinanz}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

jwt:
  # Base64 encoded secret key (min 256 bits / 32 bytes). 
  # This matches a secure signature requirement for HMAC-SHA256.
  secret: ${JWT_SECRET:dGhlLXF1aWNrLWJyb3duLWZveC1qdW1wcy1vdmVyLXRoZS1sYXp5LWRvZy1hbmQtc29tZS1tb3JlLXJhbmRvbS1jaGFyYWN0ZXJzLXNlY3JldC1rZXk=}
  expiration: 86400000 # 24 hours in milliseconds

app:
  eligibility:
    min-credit-score: 750
    partial-credit-score: 650
    max-dti: 40.0
    partial-dti: 45.0
    income-factor: 10
  terms:
    processing-fee-pct: 2.0
    gst-pct: 18.0
    default-annual-interest-rate: 12.0
